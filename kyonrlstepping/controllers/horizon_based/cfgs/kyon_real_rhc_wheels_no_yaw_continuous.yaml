solver:
  type: ilqr
  ipopt.linear_solver: ma57
  ipopt.tol: 0.1
#  ilqr.merit_der_threshold: 1e-3
#  ilqr.defect_norm_threshold: 1e-3
  ipopt.constr_viol_tol: 0.01
  ilqr.constraint_violation_threshold: 1e-2
#  ipopt.hessian_approximation: exact
  ipopt.print_level: 5
  ipopt.suppress_all_output: 'yes'
  ipopt.sb: 'yes'
  ilqr.suppress_all_output: 'yes'
  ilqr.codegen_enabled: true
  ilqr.codegen_workdir: /tmp/tyhio
  ilqr.enable_gn: true
  ilqr.hxx_reg_base: 0.0
  ilqr.n_threads: 0
  print_time: 0

constraints:
  - contact_1
  - contact_2
  - contact_3
  - contact_4

costs:
  - z_contact_1
  - z_contact_2
  - z_contact_3
  - z_contact_4
  # - vz_contact_1
  # - vz_contact_2
  # - vz_contact_3
  # - vz_contact_4
  - base_lin_velxy
  - base_lin_velz
  # - base_height
  - base_omega
  # - base_horizontal_capture
  # - base_capture
  - joint_posture_capture_roll
  - joint_posture_capture
  - v_root_reg
  - a_root_reg
  - v_jnts_reg
  - a_jnts_reg
  - v_wheel_jnts_reg
  - a_wheels_jnts_reg

#closed loop
.define:
  - &w_base_omega 8
  - &w_base_vxy 8
  - &w_base_vz 15
  - &w_base_z 15
  - &w_base_hor_capture 200.
  - &w_base_capture 500.
  - &w_contact_z 200.0
  - &w_contact_vz 500.0
  - &w_capture_postural 10.0
  - &w_capture_postural_roll 18.0
  - &w_capture_postural_ub 1.
  - &w_v_root 3e-1
  - &w_a_root 5e-1
  - &w_v_jnts 6e-1
  - &w_a_jnts 8e-2
  - &w_v_wheels 8e-2
  - &w_a_wheels 1e-1
  - &wheel_radius 0.106

base_lin_velxy:
  type: Cartesian
  distal_link: base_link
  indices: [0, 1]
  nodes: ${range(1, N+1)}
  cartesian_type: velocity
  weight: *w_base_vxy

base_lin_velz:
  type: Cartesian
  distal_link: base_link
  indices: [2]
  nodes: ${range(1, N+1)}
  cartesian_type: velocity
  weight: *w_base_vz

base_height:
  type: Cartesian
  distal_link: base_link
  indices: [2]
  nodes: ${range(1, N+1)}
  # nodes: all
  cartesian_type: position
  weight: *w_base_z

base_omega:
  type: Cartesian
  distal_link: base_link
  indices: [3, 4, 5]
  nodes: ${range(1, N-10)}
  cartesian_type: velocity
  weight: *w_base_omega

base_capture:
  type: Cartesian
  distal_link: base_link
  indices: [0, 1, 2]
  nodes: ${range(N-10, N+1)}
  cartesian_type: velocity
  weight: *w_base_capture
  
base_horizontal_capture:
  type: Cartesian
  distal_link: base_link
  indices: [3, 4]
  nodes: ${range(N-10, N+1)}
  # cartesian_type: position
  weight: *w_base_hor_capture

# ==================================
rolling_contact_1:
  type: Rolling
  frame: wheel_1
  radius: *wheel_radius

rolling_contact_2:
  type: Rolling
  frame: wheel_2
  radius: *wheel_radius

rolling_contact_3:
  type: Rolling
  frame: wheel_3
  radius: *wheel_radius

rolling_contact_4:
  type: Rolling
  frame: wheel_4
  radius: *wheel_radius

# ==================================

interaction_contact_1:
  type: VertexForce
  frame: contact_1
  fn_min: 50
  enable_fc: true
  friction_coeff: 0.2
  vertex_frames:
    - contact_1

interaction_contact_2:
  type: VertexForce
  frame: contact_2
  fn_min: 50
  enable_fc: true
  friction_coeff: 0.2
  vertex_frames:
    - contact_2

interaction_contact_3:
  type: VertexForce
  frame: contact_3
  fn_min: 50
  enable_fc: true
  friction_coeff: 0.2
  vertex_frames:
    - contact_3

interaction_contact_4:
  type: VertexForce
  frame: contact_4
  fn_min: 50
  enable_fc: true
  friction_coeff: 0.2
  vertex_frames:
    - contact_4

contact_1:
  type: Contact
  subtask: [interaction_contact_1, rolling_contact_1]

contact_2:
  type: Contact
  subtask: [interaction_contact_2, rolling_contact_2]

contact_3:
  type: Contact
  subtask: [interaction_contact_3, rolling_contact_3]

contact_4:
  type: Contact
  subtask: [interaction_contact_4, rolling_contact_4]

# when using continuous joints
joint_posture_capture_roll:
  type: Postural
  weight: *w_capture_postural_roll
  indices: [0,
            5,
            10,
            15]
  nodes: ${range(N-10, N+1)}

joint_posture_capture:
  type: Postural
  weight: *w_capture_postural
  indices: [1, 2,
            6, 7,
            11, 12,
            16, 17]
  nodes: ${range(N-10, N+1)}

# joint_posture_capture:
#   type: Postural
#   weight: *w_capture_postural
#   indices: [0, 1, 2,
#             5, 6, 7,
#             10, 11, 12,
#             15, 16, 17]
#   nodes: ${range(N-10, N+1)}

v_root_reg:
  type: Regularization
  nodes: ${range(0, 1)}
  indices: [0, 1, 2, 3, 4, 5]
  weight:
    v: *w_v_root

a_root_reg:
  type: Regularization
  nodes: ${range(0, N+1)}
  indices: [0, 1, 2, 3, 4, 5]
  weight:
    a: *w_a_root # 0.01

v_jnts_reg:
  type: Regularization
  nodes: ${range(0, N+1)}
  indices: [6, 7, 8, 
    10, 11, 12,
    14, 15, 16, 
    18, 19, 20 ]
  weight:
    v: *w_v_jnts

a_jnts_reg:
  type: Regularization
  nodes: ${range(0, N+1)}
  indices: [6, 7, 8, 
    10, 11, 12,
    14, 15, 16, 
    18, 19, 20 ]
  weight:
    a: *w_a_jnts # 0.01

v_wheel_jnts_reg:
  type: Regularization
  nodes: ${range(0, N+1)}
  indices: [9, 13, 17, 21]
  weight:
    v: *w_v_wheels

a_wheels_jnts_reg:
  type: Regularization
  nodes: ${range(0, N+1)}
  indices: [9, 13, 17, 21]
  weight:
    a: *w_a_wheels # 0.01

z_contact_1:
  type: Cartesian
  distal_link: contact_1
  indices: [2]
  cartesian_type: position
  weight: *w_contact_z

z_contact_2:
  type: Cartesian
  distal_link: contact_2
  indices: [2]
  cartesian_type: position
  weight: *w_contact_z

z_contact_3:
  type: Cartesian
  distal_link: contact_3
  indices: [2]
  cartesian_type: position
  weight: *w_contact_z

z_contact_4:
  type: Cartesian
  distal_link: contact_4
  indices: [2]
  cartesian_type: position
  weight: *w_contact_z

vz_contact_1:
  type: Cartesian
  distal_link: contact_1
  indices: [2]
  cartesian_type: velocity
  weight: *w_contact_vz

vz_contact_2:
  type: Cartesian
  distal_link: contact_2
  indices: [2]
  cartesian_type: velocity
  weight: *w_contact_vz

vz_contact_3:
  type: Cartesian
  distal_link: contact_3
  indices: [2]
  cartesian_type: velocity
  weight: *w_contact_vz

vz_contact_4:
  type: Cartesian
  distal_link: contact_4
  indices: [2]
  cartesian_type: velocity
  weight: *w_contact_vz